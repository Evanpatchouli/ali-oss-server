name: ali-oss
services:
  server:
    container_name: ali-oss-server
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    env_file:
      - .env
    ports:
      - "${PORT:-9512}:${PORT:-9512}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

networks:
  default:
    name: ali-oss
